<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M.A.N Craft | هم صدا (خوشله پیسرا)</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a1f;
    --glass: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.13);
    --ink: #f3f1ff;
    --muted: #aaa6cb;
    --g1: #7c5cff;
    --g2: #ff5ca8;
    --g3: #35d6ff;
    --grad: linear-gradient(120deg, var(--g1), var(--g2), var(--g3));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 84px; }
  body {
    font-family: "Vazirmatn", Tahoma, sans-serif;
    background: var(--bg); color: var(--ink);
    line-height: 1.9; overflow-x: hidden;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--g3); outline-offset: 2px;
  }

  /* ---------- پس‌زمینه‌ی متحرک ---------- */
  .blobs { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
  .b1 { width: 480px; height: 480px; background: var(--g1); top: -120px; right: -100px; }
  .b2 { width: 420px; height: 420px; background: var(--g2); bottom: -120px; left: -80px; animation-delay: -6s; }
  .b3 { width: 360px; height: 360px; background: var(--g3); top: 45%; left: 40%; opacity: .28; animation-delay: -11s; }
  @keyframes drift { to { transform: translate(80px, 60px) scale(1.15); } }
  .cursor-glow {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 30%), rgba(124,92,255,.16), transparent 70%);
  }
  .progress { position: fixed; top: 0; right: 0; height: 3px; width: 0; background: var(--grad); z-index: 100; }

  /* ---------- نوبار ---------- */
  .navbar {
    position: sticky; top: 12px; z-index: 50; margin: 12px auto 0;
    width: min(1040px, calc(100% - 24px));
    background: rgba(18,14,44,.6); backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 18px;
  }
  .nav-inner { padding: 0 18px; height: 62px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 900; font-size: 1.3rem; text-decoration: none; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nav-links { display: flex; gap: 4px; list-style: none; }
  .nav-links a { position: relative; display: block; padding: 8px 16px; text-decoration: none; color: var(--muted); font-weight: 600; transition: color .25s; }
  .nav-links a::after {
    content: ""; position: absolute; bottom: 2px; right: 16px; left: 16px; height: 2px;
    background: var(--grad); transform: scaleX(0); transform-origin: right; transition: transform .3s;
  }
  .nav-links a:hover, .nav-links a.active { color: #fff; }
  .nav-links a:hover::after, .nav-links a.active::after { transform: scaleX(1); }
  .nav-toggle { display: none; background: var(--glass); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; font: inherit; cursor: pointer; }

  /* ---------- صفحه‌ی اصلی (Hero) ---------- */
  main { max-width: 1060px; margin: 0 auto; padding: 0 20px; }
  .hero { min-height: 74vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 60px 0 20px; }
  .hero h1 {
    font-size: clamp(2.2rem, 7vw, 4.4rem); font-weight: 900; line-height: 1.4;
    background: linear-gradient(120deg, var(--g1), var(--g2), var(--g3), var(--g1));
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: -250% 0; } }
  .typing { font-size: clamp(1.1rem, 3vw, 1.6rem); margin-top: 14px; color: var(--muted); min-height: 2.4em; }
  .typing b { color: #fff; font-weight: 600; }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--g3); margin-right: 3px; vertical-align: middle; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hero-btns { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; justify-content: center; }
  .btn { display: inline-block; padding: 12px 28px; border-radius: 999px; text-decoration: none; font-weight: 600; transition: transform .25s, box-shadow .25s; }
  .btn.primary { background: var(--grad); color: #fff; box-shadow: 0 8px 28px rgba(124,92,255,.4); }
  .btn.ghost { border: 1px solid var(--line); background: var(--glass); }
  .btn:hover { transform: translateY(-3px); }

  /* ---------- بخش‌ها ---------- */
  section { padding: 64px 0 16px; }
  section h2 { font-size: 1.9rem; font-weight: 800; }
  section .sub { color: var(--muted); margin-bottom: 28px; }
  .reveal { opacity: 0; transform: translateY(34px); transition: opacity .8s, transform .8s; }
  .reveal.show { opacity: 1; transform: none; }

  .card {
    background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
    padding: 22px; backdrop-filter: blur(10px);
    transition: transform .2s, border-color .3s, box-shadow .3s;
  }
  .card:hover { border-color: rgba(124,92,255,.7); box-shadow: 0 14px 40px rgba(124,92,255,.22); }

  .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; perspective: 900px; }
  .news-card time { font-size: .82rem; color: var(--g3); }
  .news-card h3 { font-size: 1.15rem; margin: 6px 0; }
  .news-card p { color: var(--muted); font-size: .95rem; }

  .text-box { max-width: 780px; padding: 30px; border-right: 4px solid var(--g1); }
  .text-box p + p { margin-top: 14px; }

  .ads-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .ad {
    position: relative; overflow: hidden; min-height: 170px; border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    border: 1px solid var(--line); background: var(--glass); padding: 20px;
  }
  .ad::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 60%; right: -80%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.14), transparent);
    animation: sweep 3.6s ease-in-out infinite;
  }
  @keyframes sweep { to { right: 130%; } }
  .ad strong { font-size: 1.15rem; }
  .ad span { color: var(--muted); font-size: .9rem; }

  .custom-box { padding: 30px; color: var(--muted); }

  /* ---------- فوتر ---------- */
  footer { margin-top: 70px; position: relative; background: #070616; }
  footer svg { position: absolute; top: -39px; right: 0; width: 100%; height: 40px; display: block; }
  .footer-inner { max-width: 1060px; margin: 0 auto; padding: 30px 20px 40px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; color: var(--muted); }
  .footer-inner ul { display: flex; gap: 20px; list-style: none; }
  .footer-inner a { text-decoration: none; transition: color .2s; }
  .footer-inner a:hover { color: #fff; }

  /* ---------- کاراکتر هوش مصنوعی ---------- */
  .char-wrap { position: fixed; bottom: 6px; left: 10px; z-index: 70; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; animation: float 4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-9px); } }
  .char { width: 150px; height: 200px; margin: 0 0 0 -28px; border: 0; background: none; cursor: pointer; transform-origin: 50% 95%; padding: 0; }
  .char svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 8px 14px rgba(124,92,255,.5)); }
  .head { transform: translate(var(--fx, 0px), var(--fy, 0px)); transition: transform .15s; }
  .arm { transform-origin: 80px 96px; }
  .eye { transform-box: fill-box; transform-origin: center; animation: blinkEye 4s infinite; }
  @keyframes blinkEye { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .photo { display: none; }
  .has-photo .photo { display: block; }
  .has-photo .boyface { display: none; }
  .face {
    border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 25%, #3a2f7a, #1a1442);
  }
  .face img { width: 100%; height: 100%; object-fit: cover; }
  button.upload { color: var(--ink); font: inherit; margin-left: 8px; }
  .bubble {
    background: #fff; color: #1b1740; padding: 8px 14px; border-radius: 14px 14px 14px 4px;
    font-size: .88rem; max-width: 220px; opacity: 0; transform: translateY(8px) scale(.9);
    transition: opacity .3s, transform .3s; pointer-events: none;
  }
  .bubble.show { opacity: 1; transform: none; }

  /* حرکت‌های کاراکتر */
  .act-wave .arm { animation: armwave 3.4s ease-in-out; }
  .act-jump  { animation: jump .8s ease-out; }
  .act-shake { animation: shake .7s ease-in-out; }
  .act-think { animation: think 1.6s ease-in-out infinite; }
  .act-talk  { animation: talk .5s ease-in-out infinite; }
  @keyframes armwave {
    0% { transform: rotate(0); } 12% { transform: rotate(-110deg); }
    22% { transform: rotate(-135deg); } 32% { transform: rotate(-90deg); }
    42% { transform: rotate(-135deg); } 52% { transform: rotate(-90deg); }
    62% { transform: rotate(-135deg); } 72% { transform: rotate(-90deg); }
    82% { transform: rotate(-125deg); } 100% { transform: rotate(0); }
  }
  @keyframes jump  { 0% { transform: scale(1,1); } 20% { transform: scale(1.12,.86); } 50% { transform: translateY(-34px) scale(.95,1.1); } 80% { transform: scale(1.1,.9); } 100% { transform: none; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  @keyframes think { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes talk  { 50% { transform: scale(1.09); } }

  /* ---------- پنجره‌ی چت ---------- */
  .chat {
    position: fixed; bottom: 216px; left: 10px; z-index: 70;
    width: min(350px, calc(100vw - 20px)); height: min(440px, calc(100vh - 240px));
    background: rgba(20,16,50,.88); backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.5);
    opacity: 0; transform: translateY(20px) scale(.96); pointer-events: none; transition: opacity .3s, transform .3s;
  }
  .chat.open { opacity: 1; transform: none; pointer-events: auto; }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--grad); }
  .chat-head .face { width: 40px; height: 40px; font-size: 22px; box-shadow: 0 0 0 2px #fff; transform: none; flex-shrink: 0; }
  .chat-head strong { flex: 1; }
  .chat-head button { background: rgba(255,255,255,.22); color: #fff; border: 0; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: .8rem; cursor: pointer; }
  .picker { display: none; padding: 12px; background: rgba(0,0,0,.25); border-bottom: 1px solid var(--line); }
  .picker.open { display: block; }
  .emoji-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-row button { font-size: 24px; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); cursor: pointer; transition: transform .15s; }
  .emoji-row button:hover { transform: scale(1.15); }
  .upload { display: inline-block; margin-top: 10px; padding: 7px 14px; border-radius: 10px; background: var(--glass); border: 1px dashed var(--g3); font-size: .85rem; cursor: pointer; }
  .upload input { display: none; }
  .chat-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 8px 13px; border-radius: 14px; font-size: .92rem; line-height: 1.7; animation: pop .3s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.95); } }
  .msg.bot { background: var(--glass); border: 1px solid var(--line); align-self: flex-start; border-bottom-right-radius: 4px; }
  .msg.user { background: var(--grad); color: #fff; align-self: flex-end; border-bottom-left-radius: 4px; }
  .dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { transform: translateY(-5px); background: #fff; } }
  .chat-form { display: flex; border-top: 1px solid var(--line); }
  .chat-form input { flex: 1; border: 0; padding: 13px 14px; font: inherit; background: transparent; color: var(--ink); }
  .chat-form button { border: 0; background: none; color: var(--g3); font: inherit; font-weight: 600; padding: 0 16px; cursor: pointer; }

  /* ----- نام سایت و ظاهر گیمی ----- */
  .logo { font-family: "Press Start 2P", monospace; font-size: .8rem; }
  .hero h1 { font-family: "Press Start 2P", monospace; font-size: clamp(1.6rem, 6.2vw, 3.6rem); font-weight: 400; line-height: 1.5; }
  .hero-sub { margin-top: 10px; font-size: clamp(1.2rem, 3.6vw, 1.9rem); font-weight: 800; color: #fff; }

  /* ----- اخبار و تبلیغات داخل اخبار ----- */
  .news-card .tag { display: inline-block; font-size: .75rem; padding: 1px 12px; border-radius: 999px; background: rgba(124,92,255,.28); color: #d6ceff; margin-right: 8px; }
  .more { display: inline-block; margin-top: 10px; color: var(--g3); text-decoration: none; font-weight: 600; font-size: .9rem; }
  .more:hover { text-decoration: underline; }
  .ad-card { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center;
    border: 1px dashed rgba(53,214,255,.6); background: linear-gradient(160deg, rgba(53,214,255,.10), rgba(255,92,168,.10)); }
  .ad-card::before { content: ""; position: absolute; top: 0; bottom: 0; width: 60%; right: -80%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.12), transparent); animation: sweep 4s ease-in-out infinite; }
  .badge { align-self: flex-start; font-size: .72rem; padding: 1px 12px; border-radius: 999px; background: var(--grad); color: #fff; margin-bottom: 8px; }
  .ad-card h3 { font-size: 1.1rem; }
  .ad-card p { color: var(--muted); font-size: .92rem; }
  .ad-card .btn { align-self: flex-start; margin-top: 12px; padding: 8px 22px; font-size: .9rem; }

  /* ----- کامیونیتی ----- */
  .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .social { display: block; text-decoration: none; text-align: center; }
  .social:hover { transform: translateY(-5px); }
  .social .ico { display: block; font-size: 2rem; }
  .social small { display: block; color: var(--muted); }

  /* ----- صحبت کردن: دهان و میکروفون ----- */
  .mouth-open { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .speaking .mouth-open { opacity: 1; animation: mouthTalk .26s ease-in-out infinite alternate; }
  .speaking .smile { opacity: 0; }
  .speaking svg { animation: bob .4s ease-in-out infinite alternate; }
  @keyframes mouthTalk { from { transform: scaleY(.35); } to { transform: scaleY(4.5); } }
  @keyframes bob { to { transform: translateY(-4px); } }
  .chat-form button.mic { font-size: 1.15rem; padding: 0 10px; }
  .mic.listening { animation: micPulse .9s ease-in-out infinite; }
  @keyframes micPulse { 50% { transform: scale(1.3); } }

  /* ----- کاراکتر سه‌بعدی ----- */
  .char canvas { display: none; width: 100%; height: 100%; filter: drop-shadow(0 8px 14px rgba(124,92,255,.45)); }
  .char.is3d canvas { display: block; }
  .char.is3d svg { display: none; }
  .char.is3d.act-think, .char.is3d.act-talk { animation: none; }

  @media (max-width: 700px) {
    .nav-toggle { display: block; }
    .nav-links { display: none; position: absolute; top: 70px; right: 0; left: 0; flex-direction: column; background: rgba(18,14,44,.96); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
    .nav-links.open { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div class="blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="cursor-glow" id="glow"></div>
<div class="progress" id="progress"></div>

<!-- ========== نوبار ========== -->
<header class="navbar">
  <div class="nav-inner">
    <a class="logo" href="#top" dir="ltr">M.A.N Craft</a>
    <button class="nav-toggle" id="navToggle" aria-label="باز کردن منو">منو</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="#news">اخبار گیم</a></li>
      <li><a href="index1.html">گفت و گو</a></li>
    </ul>
  </div>
</header>

<main id="top">

  <!-- ========== صفحه‌ی اصلی ========== -->
  <div class="hero">
    <h1 dir="ltr">M.A.N Craft</h1>
    <p class="hero-sub">هم صدا (خوشله پیسرا)</p>
    <p class="typing">اینجا <b id="typed"></b><span class="caret"></span></p>
    <div class="hero-btns">
      <a class="btn primary" href="#news">دیدن اخبار گیم</a>
      <a class="btn ghost" href="#text">درباره‌ی ما</a>
    </div>
  </div>

  <!-- ========== بخش ۱: خبرها ========== -->
  <section id="news">
    <h2 class="reveal">اخبار گیم</h2>
    <p class="sub reveal">تازه‌ترین خبرهای بازی‌ها، با لینک منبع</p>
    <div class="news-grid" id="newsGrid"></div>
  </section>


</main>

<!-- ========== فوتر ========== -->
<footer>
  <svg viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 40 C200 0 400 40 600 20 S1000 0 1200 30 V40 Z" fill="#070616"/>
  </svg>
  <div class="footer-inner">
    <p>© 2026 M.A.N Craft | هم صدا (خوشله پیسرا) — همه حقوق محفوظ است.</p>
    <ul>
      <li><a href="#news">اخبار گیم</a></li>
      <li><a href="index1.html">گفت و گو</a></li>
    </ul>
  </div>
</footer>

<!-- ========== کاراکتر + چت ========== -->
<div class="chat" id="chat" role="dialog" aria-label="دستیار هوشمند">
  <div class="chat-head">
    <div class="face" id="headFace"></div>
    <strong>دستیار سایت</strong>
    <button id="muteBtn" type="button" title="روشن/خاموش کردن صدا">🔊</button>
    <button id="changeBtn" type="button">تغییر چهره</button>
  </div>
  <div class="picker" id="picker">
    <button type="button" class="upload" id="boyBtn">👦 پسر بچه</button>
    <label class="upload">📷 آپلود عکس خودت
      <input type="file" id="fileInput" accept="image/*">
    </label>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <form class="chat-form" id="chatForm">
    <input id="chatInput" type="text" placeholder="سؤالت را بنویس..." autocomplete="off">
    <button type="button" id="micBtn" class="mic" aria-label="با صدا حرف بزن" title="با صدا حرف بزن">🎤</button>
    <button type="submit">ارسال</button>
  </form>
</div>

<div class="char-wrap">
  <div class="bubble" id="bubble"></div>
  <button class="char" id="char" aria-label="باز کردن دستیار">
    <canvas id="boyCanvas" width="150" height="200"></canvas>
    <svg id="boySvg" viewBox="0 0 120 150" aria-hidden="true">
      <ellipse cx="60" cy="146" rx="30" ry="4" fill="rgba(0,0,0,.35)"/>
      <!-- پاها -->
      <rect x="42" y="122" width="14" height="20" rx="6" fill="#2a2f6b"/>
      <rect x="64" y="122" width="14" height="20" rx="6" fill="#2a2f6b"/>
      <ellipse cx="47" cy="143" rx="10" ry="5" fill="#fff"/>
      <ellipse cx="73" cy="143" rx="10" ry="5" fill="#fff"/>
      <!-- بدن و دست ثابت -->
      <rect x="36" y="86" width="48" height="44" rx="18" fill="#7c5cff"/>
      <line x1="40" y1="96" x2="30" y2="122" stroke="#7c5cff" stroke-width="11" stroke-linecap="round"/>
      <circle cx="29" cy="125" r="6" fill="#ffd7b5"/>
      <!-- سر -->
      <g class="head">
        <circle cx="30" cy="54" r="5.5" fill="#ffd7b5"/>
        <circle cx="90" cy="54" r="5.5" fill="#ffd7b5"/>
        <circle cx="60" cy="52" r="31" fill="#ffd7b5"/>
        <g class="boyface">
          <path d="M29 48 C26 14 94 14 91 48 C84 34 70 30 60 33 C50 30 36 34 29 48Z" fill="#3b2a20"/>
          <g class="eye"><circle cx="49" cy="54" r="3.6" fill="#1b1740"/><circle cx="50.2" cy="52.8" r="1.1" fill="#fff"/></g>
          <g class="eye"><circle cx="71" cy="54" r="3.6" fill="#1b1740"/><circle cx="72.2" cy="52.8" r="1.1" fill="#fff"/></g>
          <circle cx="42" cy="64" r="4.5" fill="#ff8fa3" opacity=".5"/>
          <circle cx="78" cy="64" r="4.5" fill="#ff8fa3" opacity=".5"/>
          <path class="smile" d="M51 64 Q60 73 69 64" stroke="#7a3b2e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <ellipse class="mouth-open" cx="60" cy="67" rx="6" ry="1.6" fill="#7a3b2e"/>
        </g>
        <g class="photo">
          <clipPath id="faceClip"><circle cx="60" cy="52" r="31"/></clipPath>
          <image id="photoImg" x="29" y="21" width="62" height="62" preserveAspectRatio="xMidYMid slice" clip-path="url(#faceClip)"/>
        </g>
      </g>
      <!-- دستِ تکان‌دهنده -->
      <g class="arm">
        <line x1="80" y1="96" x2="92" y2="124" stroke="#7c5cff" stroke-width="11" stroke-linecap="round"/>
        <circle cx="93" cy="128" r="6.5" fill="#ffd7b5"/>
      </g>
    </svg>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const $ = id => document.getElementById(id);

  /* ================= ۱) اخبار گیم: فقط این لیست‌ها را ویرایش کن ================= */
  // date را به شکل سال-ماه-روز (میلادی) بنویس؛ خودش به تاریخ شمسی تبدیل می‌شود.
  const newsList = [
    { tag: "GTA VI", title: "تاریخ انتشار GTA VI همچنان ۲۸ آبان است", date: "2026-11-19", note: "انتشار",
      text: "تیک‌تو و راک‌استار دوباره تأیید کرده‌اند GTA VI روز ۱۹ نوامبر ۲۰۲۶ برای PS5 و Xbox Series X|S عرضه می‌شود. نسخه‌ی PC فعلاً تاریخ رسمی ندارد.",
      url: "https://insider-gaming.com/gta-6-release-date-earnings-call/" },
    { tag: "ماینکرفت", title: "ماینکرفت بالاخره نسخه‌ی بومی Switch 2 می‌گیرد", date: "2026-10-27", note: "انتشار",
      text: "طبق اعلام موجنگ، نسخه‌ی اختصاصی Switch 2 در ۲۷ اکتبر می‌آید و گرافیک Vibrant Visuals در آن به‌صورت پیش‌فرض روشن است.",
      url: "https://craftdex.net/updates/minecraft-live-september-2026" },
    { tag: "ماینکرفت", title: "آپدیت Wilderness Bound منتشر شد", date: "2026-09-15", note: "انتشار",
      text: "آپدیتی که در Minecraft Live معرفی شده بود روی جاوا (26.3) و بدراک (26.50) آمده و یک بایوم جدید و کمپ‌های پر از گنج به بازی اضافه می‌کند.",
      url: "https://craftdex.net/updates/minecraft-live-september-2026" },
    { tag: "Call of Duty", title: "Modern Warfare 4 منتشر شد", date: "2026-10-23", note: "انتشار",
      text: "نسخه‌ی جدید کال آو دیوتی برای PS5، Xbox، PC و Nintendo Switch 2 عرضه شده است.",
      url: "https://www.talkesport.com/news/gaming/upcoming-game-release-dates-2026/" },
    { tag: "اکشن", title: "Phantom Blade Zero آخر این ماه می‌آید", date: "2026-10-29", note: "انتشار",
      text: "بازی اکشن‌نقش‌آفرینی ووشیا از استودیوی S-GAME روی PS5 و PC عرضه می‌شود.",
      url: "https://www.fixgamingchannel.com/ps5-xbox-games-october-2026/" },
    { tag: "ایسپورت", title: "مرحله‌ی حذفی Worlds لیگ آو لجندز شروع شده", date: "2026-10-15", note: "شروع",
      text: "یک‌چهارم و نیمه‌نهایی مسابقات جهانی از ۱۵ اکتبر آغاز شده و هفته‌ی بازی‌های پاریس هم از ۲۲ اکتبر شروع می‌شود.",
      url: "https://www.pcgamer.com/games/pc-game-release-dates-october-2026/" }
  ];

  // تبلیغات بین خبرها: بعد از هر ۳ خبر، یک تبلیغ نمایش داده می‌شود (نمونه‌اند؛ تبلیغ واقعی بگذار).
  const adsInNews = [
    { title: "اینجا تبلیغ شما قرار می‌گیرد", text: "فروشگاه، سرور یا کانال خودت را به گیمرهای M.A.N Craft نشان بده.", link: "#", btn: "اطلاعات بیشتر" },
    { title: "جای تبلیغ دوم", text: "متن کوتاه تبلیغ و لینک مقصد را در لیست adsInNews عوض کن.", link: "#", btn: "دیدن تبلیغ" }
  ];

  const fmtDate = iso => new Intl.DateTimeFormat("fa-IR-u-ca-persian", { dateStyle: "long", timeZone: "UTC" }).format(new Date(iso));

  const cards = [];
  newsList.forEach((n, i) => {
    cards.push(`
      <article class="card news-card reveal">
        <time>${n.note}: ${fmtDate(n.date)}</time><span class="tag">${n.tag}</span>
        <h3>${n.title}</h3><p>${n.text}</p>
        <a class="more" href="${n.url}" target="_blank" rel="noopener noreferrer">منبع خبر</a>
      </article>`);
    const ad = adsInNews[(i + 1) / 3 - 1];
    if ((i + 1) % 3 === 0 && ad) {
      cards.push(`
      <aside class="card ad-card reveal" aria-label="تبلیغات">
        <span class="badge">تبلیغات</span>
        <h3>${ad.title}</h3><p>${ad.text}</p>
        <a class="btn ghost" href="${ad.link}" target="_blank" rel="noopener noreferrer sponsored">${ad.btn}</a>
      </aside>`);
    }
  });
  $("newsGrid").innerHTML = cards.join("");

  /* ================= ۲) جلوه‌های صفحه ================= */
  // منوی موبایل
  $("navToggle").onclick = () => $("navLinks").classList.toggle("open");
  $("navLinks").onclick = () => $("navLinks").classList.remove("open");

  // نوار پیشرفت اسکرول
  addEventListener("scroll", () => {
    const h = document.documentElement;
    $("progress").style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + "%";
  });

  // نورِ دنبال‌کننده‌ی ماوس
  addEventListener("mousemove", e => {
    $("glow").style.setProperty("--mx", e.clientX + "px");
    $("glow").style.setProperty("--my", e.clientY + "px");
  });

  // ظاهر شدن آرام بخش‌ها هنگام اسکرول
  const revealObs = new IntersectionObserver(list => {
    list.forEach(en => { if (en.isIntersecting) { en.target.classList.add("show"); revealObs.unobserve(en.target); } });
  }, { threshold: .15 });
  document.querySelectorAll(".reveal").forEach(el => revealObs.observe(el));

  // مشخص کردن لینک فعال در منو
  const linkObs = new IntersectionObserver(list => {
    list.forEach(en => {
      if (en.isIntersecting) {
        document.querySelectorAll(".nav-links a").forEach(a =>
          a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
      }
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll("section").forEach(s => linkObs.observe(s));

  // کارت‌های خبر: کج شدن سه‌بعدی با ماوس
  document.querySelectorAll(".news-card").forEach(card => {
    card.addEventListener("mousemove", e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = `rotateY(${x * 12}deg) rotateX(${-y * 12}deg) translateY(-4px)`;
    });
    card.addEventListener("mouseleave", () => card.style.transform = "");
  });

  // تایپ شدن متن صفحه‌ی اصلی
  const words = ["خبرهای تازه‌ی گیم را بخوان", "ماینکرفت و GTA را دنبال کن", "با دستیار صوتی حرف بزن"];
  let wi = 0, ci = 0, deleting = false;
  (function type() {
    const w = words[wi];
    $("typed").textContent = w.slice(0, ci);
    if (!deleting && ci === w.length) { deleting = true; return setTimeout(type, 1600); }
    if (deleting && ci === 0) { deleting = false; wi = (wi + 1) % words.length; }
    ci += deleting ? -1 : 1;
    setTimeout(type, deleting ? 35 : 75);
  })();

  /* ================= ۲.۵) کاراکتر سه‌بعدی (Three.js) ================= */
  let boy3d = null;
  (function initBoy3D() {
    if (!window.THREE) return;                 // اگر اینترنت نبود، همان پسر دوبعدی نمایش داده می‌شود
    const charEl = $("char");
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: $("boyCanvas"), alpha: true, antialias: true }); } catch (e) { return; }
    const W = 150, H = 200;
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W, H, false);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
    camera.position.set(0, 0.9, 9.4); camera.lookAt(0, 0.9, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(3, 5, 6); scene.add(sun);
    const rim = new THREE.PointLight(0x7c5cff, 1.2, 30); rim.position.set(-4, 2, -3); scene.add(rim);

    // ابزارهای ساخت شکل
    const mat = (color, rough = 0.6, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough }, extra));
    const skin = mat(0xffd7b5, 0.7), shirt = mat(0x7c5cff), pants = mat(0x2a2f6b), white = mat(0xffffff), dark = mat(0x1b1740, 0.3), hairM = mat(0x3b2a20, 0.8);
    const ball = (r, m, sx = 1, sy = 1, sz = 1) => { const o = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), m); o.scale.set(sx, sy, sz); return o; };
    const tube = (r, h, m) => new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), m);

    const boy = new THREE.Group(); scene.add(boy);

    // بدن، پاها، کفش و سایه
    const torso = ball(0.62, shirt, 1, 1.05, 0.8); torso.position.y = 0.55; boy.add(torso);
    [-0.25, 0.25].forEach(x => {
      const leg = tube(0.17, 0.7, pants); leg.position.set(x, -0.38, 0); boy.add(leg);
      const shoe = ball(0.22, white, 1.1, 0.6, 1.6); shoe.position.set(x, -0.78, 0.12); boy.add(shoe);
    });
    const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.8, 32), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = -0.95; boy.add(shadow);

    // دست‌ها: گروهی که محور چرخشش شانه است
    function makeArm(x) {
      const g = new THREE.Group(); g.position.set(x, 0.95, 0);
      const a = tube(0.12, 0.75, shirt); a.position.y = -0.38; g.add(a);
      const h = ball(0.16, skin); h.position.y = -0.82; g.add(h);
      boy.add(g); return g;
    }
    const armL = makeArm(-0.7), armR = makeArm(0.7);   // armR همان دستِ تکان‌دهنده است

    // سر: کره + گوش + مو + اجزای صورت
    const head = new THREE.Group(); head.position.y = 1.85; boy.add(head);
    head.add(ball(0.85, skin));
    [-1, 1].forEach(s => { const ear = ball(0.17, skin, 1, 1, 0.6); ear.position.set(0.84 * s, -0.02, 0); head.add(ear); });
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.9, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.5), hairM);
    hair.rotation.x = -0.3; hair.position.y = 0.04; head.add(hair);
    const tuft = ball(0.2, hairM, 0.8, 1.2, 0.8); tuft.position.set(0.1, 0.92, 0.2); head.add(tuft);

    const face = new THREE.Group(); head.add(face);    // وقتی عکس بگذاری این گروه مخفی می‌شود
    const eyes = [-1, 1].map(s => {
      const e = new THREE.Group(); e.position.set(0.3 * s, 0.05, 0.77);
      e.add(ball(0.11, dark, 1, 1.15, 0.5));
      const hl = ball(0.035, white); hl.position.set(0.03, 0.05, 0.07); e.add(hl);
      face.add(e); return e;
    });
    [-1, 1].forEach(s => {
      const c = ball(0.13, mat(0xff8fa3, 0.9, { transparent: true, opacity: 0.6 }), 1, 0.8, 0.3);
      c.position.set(0.5 * s, -0.25, 0.66); face.add(c);
    });
    const smile = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.035, 8, 24, Math.PI), mat(0x7a3b2e, 0.5));
    smile.rotation.z = Math.PI; smile.position.set(0, -0.15, 0.8); face.add(smile);
    const mouthOpen = ball(0.13, mat(0x5a1f1a, 0.4), 1.3, 0.3, 0.4);
    mouthOpen.position.set(0, -0.3, 0.78); mouthOpen.visible = false; face.add(mouthOpen);

    // تکه‌ای از کره‌ی سر که عکس روی آن می‌نشیند
    const patch = new THREE.Mesh(
      new THREE.SphereGeometry(0.86, 48, 32, Math.PI / 2 - 0.85, 1.7, Math.PI / 2 - 0.85, 1.7),
      new THREE.MeshBasicMaterial({ transparent: true }));
    patch.visible = false; head.add(patch);

    function setPhoto(dataUrl) {
      if (!dataUrl) { patch.visible = false; face.visible = true; return; }
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"); c.width = c.height = 256;
        const g = c.getContext("2d"); g.beginPath(); g.arc(128, 128, 126, 0, Math.PI * 2); g.clip(); g.drawImage(img, 0, 0, 256, 256);
        patch.material.map = new THREE.CanvasTexture(c); patch.material.needsUpdate = true;
        patch.visible = true; face.visible = false;
      };
      img.src = dataUrl;
    }

    // نگاه کردن به ماوس
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    let mx = 0, my = 0;
    addEventListener("mousemove", e => {
      const r = charEl.getBoundingClientRect();
      mx = clamp((e.clientX - (r.left + r.width / 2)) / (innerWidth / 2), -1, 1);
      my = clamp((e.clientY - (r.top + r.height / 3)) / (innerHeight / 2), -1, 1);
    });

    // زاویه‌ی دست هنگام سلام: بالا می‌رود، ۵ بار تکان می‌خورد، پایین می‌آید
    const REST = 0.15, UP = 112 * Math.PI / 180, SWING = 24 * Math.PI / 180;
    function waveAngle(e) {
      const k = e / 3.4;
      if (k >= 1) return REST;
      if (k < 0.12) return REST + (UP - REST) * (k / 0.12);
      if (k < 0.82) return UP + SWING * Math.sin((k - 0.12) / 0.7 * Math.PI * 2 * 5);
      return UP + (REST - UP) * ((k - 0.82) / 0.18);
    }

    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function frame(now) {
      requestAnimationFrame(frame);
      const t = now / 1000, cl = charEl.classList;
      const speaking = cl.contains("speaking");

      if (!reduce) { boy.position.y = Math.sin(t * 2) * 0.04; torso.scale.y = 1.05 + Math.sin(t * 2) * 0.012; }

      let tx = my * 0.35, tz = 0;
      if (cl.contains("act-think")) tz = Math.sin(t * 3) * 0.22;   // فکر می‌کند: سر کج می‌شود
      if (speaking) tx += Math.sin(t * 9) * 0.05;                  // حرف می‌زند: سر کمی تکان می‌خورد
      head.rotation.y += (mx * 0.6 - head.rotation.y) * 0.12;
      head.rotation.x += (tx - head.rotation.x) * 0.12;
      head.rotation.z += (tz - head.rotation.z) * 0.12;

      const blink = (now % 4200) < 130 ? 0.1 : 1;                  // پلک زدن
      eyes.forEach(e => { e.scale.y = blink; });

      smile.visible = !speaking; mouthOpen.visible = speaking;     // دهان
      if (speaking) mouthOpen.scale.y = 0.35 + Math.abs(Math.sin(t * 16)) * 1.4;

      let ang = REST;
      if (cl.contains("act-wave")) ang = waveAngle((now - (+charEl.dataset.t || 0)) / 1000);
      armR.rotation.z += (ang - armR.rotation.z) * 0.35;
      armL.rotation.z = -REST + Math.sin(t * 2) * 0.03;

      renderer.render(scene, camera);
    }
    requestAnimationFrame(frame);
    charEl.classList.add("is3d");
    boy3d = { setPhoto };
  })();

  /* ================= ۳) کاراکتر: پسر بچه (یا عکس دلخواه) ================= */
  const STORE = "siteCharacter";
  let character = { type: "boy" };
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && (s.type === "image" || s.type === "boy")) character = s; } catch (e) {}

  function renderCharacter() {
    const isPhoto = character.type === "image";
    $("boySvg").classList.toggle("has-photo", isPhoto);
    if (boy3d) boy3d.setPhoto(isPhoto ? character.value : null);
    if (isPhoto) $("photoImg").setAttribute("href", character.value);
    const h = $("headFace"); h.innerHTML = "";
    if (isPhoto) { const img = document.createElement("img"); img.src = character.value; img.alt = ""; h.appendChild(img); }
    else h.textContent = "👦";
  }
  function saveCharacter() { try { localStorage.setItem(STORE, JSON.stringify(character)); } catch (e) {} }

  $("boyBtn").onclick = () => {
    character = { type: "boy" }; renderCharacter(); saveCharacter(); act("wave"); say("سلام دوباره! 👋");
  };
  renderCharacter();

  // آپلود عکس: کوچک و مربعی می‌شود تا در حافظه‌ی مرورگر جا شود
  $("fileInput").onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), size = 160;
      const c = document.createElement("canvas"); c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      character = { type: "image", value: c.toDataURL("image/jpeg", .85) };
      renderCharacter(); saveCharacter(); act("jump"); say("این من‌ام! 😎");
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);
  };
  $("changeBtn").onclick = () => $("picker").classList.toggle("open");

  /* ================= ۴) حرکت‌های کاراکتر ================= */
  const ACTS = ["act-wave", "act-jump", "act-shake", "act-think", "act-talk"];
  const DUR = { wave: 3400, jump: 800, shake: 700 };
  function act(name, ms = DUR[name] || 1200) {
    const c = $("char");
    c.classList.remove(...ACTS); void c.offsetWidth;   // ریست انیمیشن
    c.classList.add("act-" + name);
    c.dataset.t = performance.now();                  // زمان شروع حرکت (برای دست سه‌بعدی)
    clearTimeout(c._t);
    if (ms) c._t = setTimeout(() => c.classList.remove("act-" + name), ms);
  }
  function stopAct() { $("char").classList.remove(...ACTS); }

  let bubbleTimer;
  function say(text, ms = 3200) {
    const b = $("bubble"); b.textContent = text; b.classList.add("show");
    clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => b.classList.remove("show"), ms);
  }

  // نگاه کردن به سمت ماوس
  addEventListener("mousemove", e => {
    const f = $("char");
    f.style.setProperty("--fx", ((e.clientX / innerWidth - .5) * 5) + "px");
    f.style.setProperty("--fy", ((e.clientY / innerHeight - .5) * 4) + "px");
  });

  // سلام کردن اول ورود، و هر چند ثانیه یک حرکت تصادفی وقتی چت بسته است
  setTimeout(() => { act("wave"); say("سلام! من دستیار این سایتم 👋"); }, 1200);
  setInterval(() => {
    if (!$("chat").classList.contains("open")) act(Math.random() > .5 ? "jump" : "wave");
  }, 9000);

  /* ================= ۵) دستیار هوشمند ================= */
  // هر مورد: کلمه‌های کلیدی + جواب. خودت اضافه کن.
  const knowledge = [
    { keys: ["سلام", "درود"],                        answer: "سلام! به M.A.N Craft خوش اومدی. هر چی درباره‌ی گیم می‌خوای بپرس.", move: "wave" },
    { keys: ["gta", "جی تی ای", "جی‌تی‌ای"],         answer: "جی تی ای شش قراره بیست و هشت آبان، یعنی نوزده نوامبر، روی پلی‌استیشن پنج و ایکس‌باکس بیاد. نسخه‌ی کامپیوترش هنوز تاریخ نداره.", move: "jump" },
    { keys: ["ماین", "minecraft"],                   answer: "آپدیت وایلدرنس باند اومده و نسخه‌ی سوییچ دو هم بیست و هفتم اکتبر میاد.", move: "jump" },
    { keys: ["خبر", "اخبار", "گیم", "بازی"],         answer: "خبرهای گیم توی بخش اخبار گیم همین صفحه‌ست. زیر هر خبر لینک منبعش هم هست.", move: "jump" },
    { keys: ["تبلیغ", "بنر"],                        answer: "تبلیغ‌ها بین خبرها هستن. برای تبلیغ دادن از بخش کامیونیتی پیام بده.", move: "jump" },
    { keys: ["اسم", "کی هستی", "کیستی"],             answer: "من دستیار کوچیک ام ای ان کرفت هستم.", move: "wave" },
    { keys: ["تماس", "ارتباط", "دیسکورد", "یوتیوب"], answer: "لینک‌های ما توی بخش کامیونیتی هست.", move: "jump" }
  ];
  const fallback = { answer: "این رو نمی‌دونم! ولی می‌تونی درباره‌ی جی تی ای، ماینکرفت یا اخبار گیم ازم بپرسی.", move: "shake" };

    const chat = $("chat"), chatLog = $("chatLog"), chatInput = $("chatInput");

  function addMessage(text, who) {
    const d = document.createElement("div");
    d.className = "msg " + who; d.textContent = text;   // textContent = امن
    chatLog.appendChild(d); chatLog.scrollTop = chatLog.scrollHeight;
    return d;
  }
  function getAnswer(q) {
    return knowledge.find(k => k.keys.some(w => q.includes(w))) || fallback;
  }

  // ---------- صدای کاراکتر (متن به گفتار) ----------
  const synth = window.speechSynthesis;
  let voiceOn = true, faVoice = null, warned = false;
  function loadVoices() { if (synth) faVoice = synth.getVoices().find(v => (v.lang || "").toLowerCase().startsWith("fa")) || null; }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

  function speak(text) {
    if (!synth || !voiceOn) return;
    if (!faVoice && !warned && synth.getVoices().length) {
      warned = true;
      addMessage("نکته: صدای فارسی روی این مرورگر/دستگاه پیدا نشد؛ ممکن است صدا درست خوانده نشود. در Chrome یا Edge معمولاً بهتر کار می‌کند.", "bot");
    }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, ""));
    u.lang = "fa-IR"; if (faVoice) u.voice = faVoice;
    u.pitch = 1.6; u.rate = 1;                         // صدای بچگانه‌تر
    u.onstart = () => $("char").classList.add("speaking");
    u.onend = u.onerror = () => $("char").classList.remove("speaking");
    synth.speak(u);
  }
  $("muteBtn").onclick = () => {
    voiceOn = !voiceOn;
    $("muteBtn").textContent = voiceOn ? "🔊" : "🔇";
    if (!voiceOn && synth) { synth.cancel(); $("char").classList.remove("speaking"); }
  };

  // ---------- گوش دادن به صدای تو (گفتار به متن) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, waiting = false;
  if (!SR) { $("micBtn").style.display = "none"; }
  else {
    rec = new SR(); rec.lang = "fa-IR"; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onstart = () => { listening = true; $("micBtn").classList.add("listening"); act("think", 0); chatInput.placeholder = "دارم گوش می‌دم..."; };
    rec.onend = () => { listening = false; $("micBtn").classList.remove("listening"); chatInput.placeholder = "سؤالت را بنویس..."; if (!waiting) stopAct(); };
    rec.onerror = e => {
      stopAct();
      addMessage(e.error === "not-allowed" ? "اجازه‌ی میکروفون داده نشده. در مرورگر اجازه‌اش را بده و دوباره امتحان کن." : "صدات را نشنیدم، دوباره امتحان کن.", "bot");
    };
    rec.onresult = e => { chatInput.value = e.results[0][0].transcript; $("chatForm").requestSubmit(); };
  }
  $("micBtn").onclick = () => {
    if (!rec) return;
    if (listening) { rec.stop(); return; }
    if (synth) synth.cancel();
    try { rec.start(); } catch (e) {}
  };

  // ---------- باز کردن چت و ارسال پیام ----------
  $("char").onclick = () => {
    chat.classList.toggle("open");
    if (chat.classList.contains("open")) {
      $("bubble").classList.remove("show");
      act("wave");
      if (!chatLog.children.length) {
        const hi = "سلام! من دستیار ام ای ان کرفت‌ام. هر سؤالی داری بپرس یا با میکروفون باهام حرف بزن.";
        addMessage(hi, "bot"); speak(hi);
      }
      chatInput.focus();
    } else if (synth) { synth.cancel(); $("char").classList.remove("speaking"); }
  };

  // ---------- هوش مصنوعی واقعی (از طریق server.js) ----------
  // اگر سایت را با server.js اجرا کنی، این آدرس کار می‌کند. اگر سرور جدا گذاشتی، آدرس کامل آن را بنویس.
  const API_URL = "/api/chat";
  const history = [];                                  // گفتگو برای اینکه هوش مصنوعی یادش بماند

  async function askAI(q) {
    history.push({ role: "user", content: q });
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      const res = await fetch(API_URL, {
        method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
        body: JSON.stringify({ messages: history.slice(-12), news: newsList.map(n => n.title + ": " + n.text).join("\n") })
      });
      clearTimeout(timer);
      if (!res.ok) throw new Error("status " + res.status);
      const data = await res.json();
      if (!data.reply) throw new Error("empty reply");
      history.push({ role: "assistant", content: data.reply });
      return { answer: data.reply, move: "jump" };
    } catch (err) {
      console.warn("هوش مصنوعی در دسترس نیست، از لیست جواب‌ها استفاده شد:", err);
      const r = getAnswer(q);                          // پشتیبان: همان لیست knowledge
      history.push({ role: "assistant", content: r.answer });
      return r;
    }
  }

  $("chatForm").onsubmit = async e => {
    e.preventDefault();
    const q = chatInput.value.trim(); if (!q) return;
    addMessage(q, "user"); chatInput.value = "";

    waiting = true; act("think", 0);                   // فکر می‌کند
    const typing = addMessage("", "bot");
    typing.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';

    const r = await askAI(q);
    typing.remove(); waiting = false;
    addMessage(r.answer, "bot");
    act(r.move);                                       // واکنش: پرش، سلام یا تکان دادن سر
    speak(r.answer);                                   // و جواب را بلند می‌گوید
  };
</script>
</body>
</html>
